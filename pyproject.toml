[project]
name = "vae-xray"
version = "0.1.0"
description = "ECE 285 HW1: convolutional VAE for chest X-ray generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "pytorch-ignite>=0.5",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vae_xray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
